<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#14112a">
    <title>응원 메시지</title>
    <style>
        :root {
            --bg: #14112a;
            --panel: #1f1a3d;
            --line: #3a3366;
            --text: #ffffff;
            --sub: #b9b3e0;
            --accent: #ffcc33;
            --accent-text: #14112a;
            --error: #ff7a8a;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        .screen {
            position: fixed;
            inset: 0;
            display: none;
        }

        .screen.active {
            display: flex;
        }

        /* ---------- 입력 화면 ---------- */
        #input-screen {
            flex-direction: column;
            padding: max(12px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            gap: 10px;
        }

        .head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        .head h1 {
            margin: 0;
            font-size: clamp(18px, 4.5vh, 26px);
        }

        .head p {
            margin: 0;
            font-size: clamp(12px, 3.2vh, 15px);
            color: var(--sub);
        }

        form {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            min-height: 0;
        }

        .field {
            position: relative;
            display: flex;
        }

        .field span {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--line);
            color: var(--sub);
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .field input {
            width: 100%;
            height: 100%;
            min-height: 44px;
            padding: 0 12px 0 48px;
            border: 2px solid var(--line);
            border-radius: 12px;
            background: var(--panel);
            color: var(--text);
            font-size: 16px;
            /* 16px 미만이면 iOS가 확대함 */
            outline: none;
        }

        .field input::placeholder {
            color: #7d76ad;
        }

        .field input:focus {
            border-color: var(--accent);
        }

        .field input.empty {
            border-color: var(--error);
        }

        .field input:not(:placeholder-shown)+span,
        .field input:not(:placeholder-shown)~span {
            background: var(--accent);
            color: var(--accent-text);
        }

        #send {
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: var(--accent-text);
            font-size: 20px;
            font-weight: 800;
            min-height: 44px;
            cursor: pointer;
        }

        #send:active {
            transform: scale(0.98);
        }

        #error {
            min-height: 1.2em;
            margin: 0;
            font-size: 13px;
            color: var(--error);
        }

        /* ---------- 흐르는 화면 ---------- */
        #flow-screen {
            align-items: center;
            overflow: hidden;
            background: #07051a;
            animation: bgpulse 6s ease-in-out infinite;
        }

        @keyframes bgpulse {

            0%,
            100% {
                background: radial-gradient(ellipse at 30% 50%, #3a1a6e 0%, #07051a 65%);
            }

            50% {
                background: radial-gradient(ellipse at 70% 50%, #0f3a6e 0%, #07051a 65%);
            }
        }

        #fx {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* 회전하는 빛줄기 */
        .beams {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 250vmax;
            height: 250vmax;
            margin: -125vmax 0 0 -125vmax;
            background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, 0.07) 0deg 6deg, transparent 6deg 20deg);
            animation: spin 24s linear infinite;
            pointer-events: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .track {
            position: relative;
            width: max-content;
            flex-shrink: 0;
            display: flex;
            white-space: nowrap;
            will-change: transform;
            animation: marquee var(--dur) linear infinite;
        }

        @keyframes marquee {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        .unit {
            display: flex;
            flex-shrink: 0;
        }

        .ch {
            display: inline-block;
            font-weight: 900;
            font-size: 64vh;
            line-height: 1.2;
            text-shadow: 0 0 0.04em #fff, 0 0 0.12em currentColor, 0 0 0.3em currentColor;
            animation: hue 3s linear infinite, wave 1.6s ease-in-out infinite;
            animation-delay: var(--d), var(--d);
        }

        .ch.sp {
            width: 0.35em;
        }

        .ch.star {
            color: #fff5b0;
            font-size: 40vh;
            padding: 0 0.3em;
            animation: twinkle 1.2s ease-in-out infinite, wave 1.6s ease-in-out infinite;
        }

        @keyframes hue {
            0% { color: #ff4d6d; }
            17% { color: #ffb020; }
            33% { color: #ffee55; }
            50% { color: #4dff9a; }
            67% { color: #3fd3ff; }
            83% { color: #b36bff; }
            100% { color: #ff4d6d; }
        }

        @keyframes wave {

            0%,
            100% {
                transform: translateY(-5%) scale(1);
            }

            50% {
                transform: translateY(5%) scale(1.06);
            }
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 1;
                transform: rotate(0) scale(1);
            }

            50% {
                opacity: 0.6;
                transform: rotate(180deg) scale(0.7);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            #flow-screen,
            .beams,
            .ch,
            .ch.star {
                animation: none;
            }

            .track {
                animation-duration: calc(var(--dur) * 2);
            }
        }

        #back {
            position: absolute;
            right: max(12px, env(safe-area-inset-right));
            bottom: max(10px, env(safe-area-inset-bottom));
            padding: 8px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(7, 5, 26, 0.6);
            color: var(--sub);
            z-index: 2;
            font-size: 13px;
            cursor: pointer;
        }

        /* ---------- 세로 방향 안내 ---------- */
        #rotate {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            background: var(--bg);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            padding: 24px;
        }

        #rotate .icon {
            width: 48px;
            height: 80px;
            border: 4px solid var(--accent);
            border-radius: 10px;
            animation: turn 1.8s ease-in-out infinite;
        }

        @keyframes turn {

            0%,
            20% {
                transform: rotate(0);
            }

            60%,
            100% {
                transform: rotate(-90deg);
            }
        }

        @media (orientation: portrait) and (max-width: 820px) {
            #rotate {
                display: flex;
            }
        }
    </style>
</head>

<body>
    <div id="rotate">
        <div class="icon"></div>
        <p>휴대폰을 가로로 돌려 주세요</p>
    </div>

    <section id="input-screen" class="screen active">
        <div class="head">
            <h1>응원 메시지 보내기</h1>
            <p>최대 5개까지 적고 보내기를 눌러 주세요</p>
        </div>
        <form id="form" novalidate autocomplete="off">
            <label class="field"><input type="text" maxlength="30" placeholder="첫 번째 응원 메시지"><span>1</span></label>
            <label class="field"><input type="text" maxlength="30" placeholder="두 번째 응원 메시지"><span>2</span></label>
            <label class="field"><input type="text" maxlength="30" placeholder="세 번째 응원 메시지"><span>3</span></label>
            <label class="field"><input type="text" maxlength="30" placeholder="네 번째 응원 메시지"><span>4</span></label>
            <label class="field"><input type="text" maxlength="30" placeholder="다섯 번째 응원 메시지"><span>5</span></label>
            <button id="send" type="submit">보내기</button>
        </form>
        <p id="error" role="alert"></p>
    </section>

    <section id="flow-screen" class="screen">
        <button id="back" type="button">다시 쓰기</button>
    </section>

    <script>
        const form = document.getElementById('form');
        const inputs = [...form.querySelectorAll('input')];
        const error = document.getElementById('error');
        const inputScreen = document.getElementById('input-screen');
        const flowScreen = document.getElementById('flow-screen');
        const back = document.getElementById('back');

        // Enter 키로 다음 칸 이동
        inputs.forEach((input, i) => {
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter' && i < inputs.length - 1) {
                    e.preventDefault();
                    inputs[i + 1].focus();
                }
            });
            input.addEventListener('input', () => input.classList.remove('empty'));
        });

        form.addEventListener('submit', e => {
            e.preventDefault();
            const messages = inputs.map(input => input.value.trim()).filter(Boolean);
            if (messages.length === 0) {
                inputs[0].classList.add('empty');
                error.textContent = '응원 메시지를 1개 이상 입력해 주세요.';
                inputs[0].focus();
                return;
            }
            error.textContent = '';
            document.activeElement.blur();
            showFlow(messages);
        });

        back.addEventListener('click', () => {
            stopFlow();
            flowScreen.classList.remove('active');
            inputScreen.classList.add('active');
        });

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let current = [];
        let stopFx = null;

        function stopFlow() {
            if (stopFx) stopFx();
            stopFx = null;
            flowScreen.querySelectorAll('.track').forEach(t => t.remove());
        }

        function makeChar(text, className, index) {
            const span = document.createElement('span');
            span.className = className;
            span.textContent = text;
            span.style.setProperty('--d', `${-index * 0.12}s`);
            return span;
        }

        function showFlow(messages) {
            current = messages;
            stopFlow();
            inputScreen.classList.remove('active');
            flowScreen.classList.add('active');

            // 메시지를 ✦로 이어 한 줄로 만든다. 글자마다 색·물결 시점을 어긋나게 준다
            const unit = document.createElement('div');
            unit.className = 'unit';
            let index = 0;
            messages.forEach(text => {
                [...text].forEach(c => {
                    unit.appendChild(c === ' ' ? makeChar(' ', 'ch sp', index) : makeChar(c, 'ch', index));
                    index++;
                });
                unit.appendChild(makeChar('✦', 'ch star', index++));
            });

            const track = document.createElement('div');
            track.className = 'track';
            track.appendChild(unit);
            flowScreen.insertBefore(track, back);

            // 한 묶음이 화면보다 짧으면 반복해서 채운 뒤, 전체를 한 번 더 복제해 끊김 없이 이어지게 한다
            const width = flowScreen.clientWidth;
            while (track.scrollWidth < width) track.appendChild(unit.cloneNode(true));
            [...track.children].forEach(c => track.appendChild(c.cloneNode(true)));

            const speed = flowScreen.clientHeight * 1.1; // 초당 이동 px (화면 높이 기준)
            track.style.setProperty('--dur', `${track.scrollWidth / 2 / speed}s`);

            stopFx = startFx();
        }

        // 배경 효과: 빛줄기, 반짝이는 별, 불꽃, 색종이, 터치 불꽃
        function startFx() {
            const beams = document.createElement('div');
            beams.className = 'beams';
            const canvas = document.createElement('canvas');
            canvas.id = 'fx';
            flowScreen.prepend(beams, canvas);

            const ctx = canvas.getContext('2d');
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const stars = Array.from({ length: 90 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.6 + 0.4,
                phase: Math.random() * Math.PI * 2
            }));
            const parts = [];

            function burst(x, y, count) {
                const hue = Math.random() * 360;
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1.5 + Math.random() * 5;
                    parts.push({
                        type: 'spark', x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        decay: 0.012 + Math.random() * 0.015,
                        size: 1.5 + Math.random() * 2.5,
                        color: `hsl(${hue + Math.random() * 50}, 100%, 65%)`
                    });
                }
            }

            function confetti() {
                parts.push({
                    type: 'confetti',
                    x: Math.random() * w, y: -10,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: 1.5 + Math.random() * 2,
                    rot: Math.random() * Math.PI * 2,
                    vr: (Math.random() - 0.5) * 0.3,
                    life: 1,
                    decay: 0.003,
                    size: 5 + Math.random() * 6,
                    color: `hsl(${Math.random() * 360}, 90%, 60%)`
                });
            }

            let raf;
            let lastBurst = 0;
            function frame(now) {
                raf = requestAnimationFrame(frame);
                ctx.clearRect(0, 0, w, h);

                stars.forEach(s => {
                    ctx.globalAlpha = reduceMotion ? 0.7 : 0.4 + 0.6 * Math.abs(Math.sin(now / 600 + s.phase));
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                });

                if (!reduceMotion) {
                    if (now - lastBurst > 700) {
                        lastBurst = now;
                        burst(Math.random() * w, h * (0.1 + Math.random() * 0.8), 60);
                    }
                    if (Math.random() < 0.5) confetti();
                }

                for (let i = parts.length - 1; i >= 0; i--) {
                    const p = parts[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;
                    if (p.life <= 0 || p.y > h + 20) {
                        parts.splice(i, 1);
                        continue;
                    }
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    if (p.type === 'spark') {
                        p.vx *= 0.98;
                        p.vy = p.vy * 0.98 + 0.05;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        p.rot += p.vr;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rot);
                        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                        ctx.restore();
                    }
                }
                ctx.globalAlpha = 1;
            }
            raf = requestAnimationFrame(frame);

            const onTap = e => burst(e.clientX, e.clientY, 90);
            flowScreen.addEventListener('pointerdown', onTap);

            return () => {
                cancelAnimationFrame(raf);
                flowScreen.removeEventListener('pointerdown', onTap);
                canvas.remove();
                beams.remove();
            };
        }

        // 화면 크기가 바뀌면(회전 등) 흐름 다시 계산
        let resizeTimer;
        window.addEventListener('resize', () => {
            if (!flowScreen.classList.contains('active')) return;
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => showFlow(current), 200);
        });
    </script>
</body>

</html>
